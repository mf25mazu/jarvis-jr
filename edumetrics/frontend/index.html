<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduMetrics — Plataforma Educacional Inteligente</title>
  <meta name="description" content="Plataforma de análise educacional com metacognição, IA diagnóstica e relatórios avançados.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Lucide Icons (local) -->
  <script src="vendor/lucide.min.js"></script>

  <!-- Chart.js (local) -->
  <script src="vendor/chart.umd.min.js"></script>

  <!-- Estilos -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Favicon emoji -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
</head>
<body>

  <!-- Loading splash -->
  <div id="splash" style="
    position:fixed;inset:0;background:#4f46e5;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    z-index:9999;color:#fff;gap:16px;
    transition:opacity .4s;
  ">
    <div style="font-size:2.5rem;font-weight:900;letter-spacing:-.04em;">EduMetrics</div>
    <div style="font-size:.875rem;opacity:.75;">Carregando plataforma...</div>
    <div style="width:40px;height:40px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;"></div>
  </div>

  <!-- App root -->
  <div id="app"></div>

  <!-- App entry point (ESModules) -->
  <script type="module" src="js/app.js"></script>

  <script>
    // Esconder splash após carregamento
    window.addEventListener('load', () => {
      setTimeout(() => {
        const splash = document.getElementById('splash');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(() => splash.remove(), 400);
        }
      }, 600);
    });
  </script>

  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</body>
</html>
